<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: rgba(255,255,255,0.08); }
    .title { fill: #e6edf3; font-size: 15px; font-weight: 700; }
    .sub { fill: #8b949e; font-size: 11px; }
    .axis { fill: #8b949e; font-size: 10px; }
    .grid { stroke: #30363d; stroke-width: 1; }
    .val { fill: #c9d1d9; font-size: 10px; font-family: "SF Mono", Consolas, monospace; }
    .bar-pre { fill: #3987e5; }
    .bar-ai { fill: #d95926; }
    .yr { fill: #8b949e; font-size: 11px; }
  </style>
  <rect class="bg" width="760" height="300" rx="10"/>
  <text x="24" y="30" class="title">Lines changed per active coding day</text>
  <text x="24" y="48" class="sub">personal commit history, aggregated by year (* = partial year)</text>
<line x1="50" x2="736" y1="196.7" y2="196.7" class="grid"/>
<line x1="50" x2="736" y1="133.3" y2="133.3" class="grid"/>
<line x1="50" x2="736" y1="70.0" y2="70.0" class="grid"/>
<rect x="50.0" y="222.4" width="101.0" height="37.6" rx="4" class="bar-pre"/>
<text x="100.5" y="214.4" text-anchor="middle" class="val">693</text>
<text x="100.5" y="280.0" text-anchor="middle" class="yr">2021</text>
